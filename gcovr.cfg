# gcovr configuration file

# Include only production source files (exclude tests/ and build/)
filter = peci\.c
filter = peci\.h
filter = peci_cmds\.c
filter = dbus_raw_peci\.cpp

exclude = tests/
exclude = build/
exclude = subprojects/

exclude-unreachable-branches = yes
exclude-throw-branches = yes

html = yes
print-summary = yes

html-title = AMI libpeci Coverage Report
html-self-contained = yes
